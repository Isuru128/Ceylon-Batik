<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | Ceylon Batik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet" onerror="this.onerror=null;this.href='../static/css/style.css'">
</head>
<body>
<header class="site-header fixed-top"><nav class="navbar navbar-expand-xl"><div class="container-fluid px-3 px-lg-5"><a class="navbar-brand brand-lockup" th:href="@{/}" href="index.html"><span class="brand-mark">CB</span><span><strong>Ceylon Batik</strong><small>සිලෝන් බතික්</small></span></a><div class="header-actions ms-auto"><div id="userMenuSlot"></div><a class="login-link" th:href="@{/shop.html}" href="shop.html"><i class="fa-solid fa-store"></i><span>Shop</span></a><a class="icon-btn count-btn" th:href="@{/cart.html}" href="cart.html" aria-label="Cart"><i class="fa-solid fa-cart-shopping"></i><span class="count-badge" id="cartCount">0</span></a></div></div></nav></header>
<main class="inner-main">
    <section class="page-hero"><div class="container-fluid px-3 px-lg-5"><p class="eyebrow">Saved Pieces</p><h1>Your Batik Wishlist</h1><p>Keep your favorite handcrafted pieces ready for your next order.</p></div></section>
    <section class="section-space compact-section">
        <div class="container-fluid px-3 px-lg-5">
            <div class="list-panel">
                <article class="list-item"><img src="/images/01.jpeg" alt="Island Bloom Batik Dress"><div><h2>Island Bloom Batik Dress</h2><p>Rs. 6,990</p></div><button class="btn add-cart-btn" data-cart type="button"><i class="fa-solid fa-cart-plus"></i>Add to Cart</button></article>
                <article class="list-item"><img src="/images/03.jpeg" alt="Sunset Batik Sarong Set"><div><h2>Sunset Batik Sarong Couple Set</h2><p>Rs. 10,900</p></div><button class="btn add-cart-btn" data-cart type="button"><i class="fa-solid fa-cart-plus"></i>Add to Cart</button></article>
                <article class="list-item pattern-card"><div class="pattern-preview"></div><div><h2>Blue Lotus Evening Batik Saree</h2><p>Rs. 11,750</p></div><button class="btn add-cart-btn" data-cart type="button"><i class="fa-solid fa-cart-plus"></i>Add to Cart</button></article>
            </div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}" src="/js/script.js" onerror="this.onerror=null;this.src='../static/js/script.js'"></script>
</body>
</html>
