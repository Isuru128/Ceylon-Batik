<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Ceylon Batik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet" onerror="this.onerror=null;this.href='../static/css/style.css'">
</head>
<body class="auth-body register-body">
<main class="auth-shell">
    <a class="brand-lockup auth-brand" th:href="@{/}" href="index.html">
        <span class="brand-mark">CB</span>
        <span><strong>Ceylon Batik</strong><small>සිලෝන් බතික්</small></span>
    </a>
    <section class="auth-panel register-panel">
        <div class="auth-art">
            <img th:src="@{/images/01.jpeg}" src="/images/01.jpeg" onerror="this.onerror=null;this.src='../static/images/01.jpeg'" alt="Ceylon Batik traditional wear collection">
            <div>
                <p class="eyebrow">Join Ceylon Batik</p>
                <h1>Create your account</h1>
                <p>Save your wishlist, speed up checkout, and discover new Sri Lankan batik collections first.</p>
            </div>
        </div>
        <form class="auth-form" id="registerForm" novalidate>
            <h2>Sign Up</h2>
            <label>Full name<input type="text" id="registerName" placeholder="Your name" required></label>
            <label>Email or phone number<input type="text" id="registerContact" placeholder="Email / Phone number" required></label>
            <label>Password<input type="password" id="registerPassword" placeholder="Create password" required></label>
            <label>Confirm password<input type="password" id="registerConfirm" placeholder="Confirm password" required></label>
            <label class="check-line"><input type="checkbox" id="registerAgree"> Send me new arrivals and batik offers</label>
            <button class="btn cb-btn" type="submit">Create Account</button>
            <p class="form-message" id="registerMessage"></p>
            <p class="auth-switch">Already have an account? <a th:href="@{/login.html}" href="login.html">Login</a></p>
        </form>
    </section>
</main>
<script th:src="@{/js/script.js}" src="/js/script.js" onerror="this.onerror=null;this.src='../static/js/script.js'"></script>
</body>
</html>
