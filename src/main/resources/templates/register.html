<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Ceylon Batik</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet">
</head>


<body class="auth-body register-body">


<main class="auth-shell">


    <a class="brand-lockup auth-brand" href="/">
        <span class="brand-mark">CB</span>

        <span>
            <strong>Ceylon Batik</strong>
            <small>සිලෝන් බතික්</small>
        </span>
    </a>


    <section class="auth-panel">


        <div class="auth-art">

            <img src="/images/01.jpeg"
                 alt="Ceylon Batik">

            <div>

                <p class="eyebrow">
                    Join Ceylon Batik
                </p>

                <h1>
                    Create your account
                </h1>

                <p>
                    Save your wishlist and enjoy faster checkout.
                </p>

            </div>

        </div>



        <form class="auth-form"
              id="registerForm">


            <h2>
                Sign Up
            </h2>


            <label>
                Full Name

                <input type="text"
                       id="fullName"
                       required
                       autocomplete="name">
            </label>



            <label>
                Email or Phone Number

                <input type="text"
                       id="contact"
                       placeholder="example@gmail.com / +94771234567"
                       required
                       autocomplete="username">
            </label>



            <label>
                Password

                <input type="password"
                       id="password"
                       minlength="8"
                       required
                       autocomplete="new-password">
            </label>



            <label>
                Confirm Password

                <input type="password"
                       id="confirmPassword"
                       minlength="8"
                       required
                       autocomplete="new-password">
            </label>



            <button class="btn cb-btn"
                    type="submit"
                    id="registerSubmit">

                Create Account

            </button>



            <p id="message"
               class="form-message"
               role="alert"
               aria-live="polite">
            </p>



            <p class="auth-switch">

                Already have an account?

                <a href="/login.html">
                    Login
                </a>

            </p>


        </form>


    </section>


</main>



<script src="/js/auth.js"></script>


<script>

    const form = document.getElementById("registerForm");
    const submitBtn = document.getElementById("registerSubmit");

    form.addEventListener("submit", async (e) => {

        e.preventDefault();

        const fullName       = document.getElementById("fullName").value.trim();
        const contact        = document.getElementById("contact").value.trim();
        const password       = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const message        = document.getElementById("message");

        if (!fullName || !contact || !password || !confirmPassword) {
            message.textContent = "Please fill in all fields.";
            message.className = "form-message form-message--error";
            return;
        }

        if (password !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            message.className = "form-message form-message--error";
            return;
        }

        if (password.length < 8) {
            message.textContent = "Password must be at least 8 characters.";
            message.className = "form-message form-message--error";
            return;
        }

        // Loading state
        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account…";
        message.textContent = "";
        message.className = "form-message";

        try {

            await CBAuth.register({
                fullName,
                contact,
                password,
                confirmPassword
            });

            message.textContent = "Account created successfully. Redirecting to login…";
            message.className = "form-message form-message--success";

            setTimeout(() => {
                window.location.href = "/login.html";
            }, 1500);

        } catch (error) {

            message.textContent = error.message || "Registration failed. Please try again.";
            message.className = "form-message form-message--error";
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Account";

        }

    });


</script>


</body>

</html>
