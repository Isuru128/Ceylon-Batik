<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Ceylon Batik Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet">

    <style>
        body.admin-login-body {
            background: linear-gradient(135deg, #161846 0%, #1f235f 50%, #2b1f48 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .admin-login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            padding: 40px 36px;
            position: relative;
            overflow: hidden;
        }

        .admin-login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--batik-pink), var(--batik-blue));
        }

        .admin-brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .admin-brand-mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: url("/images/logo1.png") center / contain no-repeat;
            background-color: var(--batik-white);
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(31, 35, 95, 0.12);
        }

        .admin-brand-header h1 {
            font-family: "Playfair Display", serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--batik-ink);
            margin: 0;
        }

        .admin-brand-header p {
            color: var(--batik-muted);
            font-size: 0.88rem;
            margin-top: 4px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--batik-ink);
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid var(--batik-border);
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--batik-pink);
            box-shadow: 0 0 0 3px rgba(255, 144, 188, 0.25);
        }

        .btn-admin-submit {
            background: var(--batik-ink);
            color: var(--batik-white);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-admin-submit:hover {
            background: #141743;
            color: var(--batik-white);
            transform: translateY(-1px);
        }

        .admin-hint {
            background: #f8f9fe;
            border: 1px dashed var(--batik-blue);
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 24px;
            font-size: 0.82rem;
            color: var(--batik-muted);
        }

        .admin-hint strong {
            color: var(--batik-ink);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--batik-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .back-link:hover {
            color: var(--batik-pink);
        }
    </style>
</head>
<body class="admin-login-body">

    <div class="admin-login-card">
        <div class="admin-brand-header">
            <div class="admin-brand-mark"></div>
            <h1>Ceylon Batik</h1>
            <p>Sign in to Management Portal</p>
        </div>

        <form id="adminLoginForm" novalidate>
            <div class="mb-3">
                <label class="form-label" for="adminContact">Admin Username or Email</label>
                <input type="text" class="form-control" id="adminContact" placeholder="Enter username or email" required autocomplete="username">
            </div>

            <div class="mb-3">
                <label class="form-label" for="adminPassword">Password</label>
                <input type="password" class="form-control" id="adminPassword" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-admin-submit" id="btnAdminLoginSubmit">
                <i class="fa-solid fa-lock me-2"></i> Sign In to Portal
            </button>

            <p id="adminMessage" class="form-message mt-3" role="alert" aria-live="polite"></p>
        </form>

        <a href="/" class="back-link">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Main Store
        </a>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("adminLoginForm");
            const submitBtn = document.getElementById("btnAdminLoginSubmit");
            const message = document.getElementById("adminMessage");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const contact = document.getElementById("adminContact").value.trim();
                const password = document.getElementById("adminPassword").value.trim();

                if (!contact || !password) {
                    message.textContent = "Please enter both admin username and password.";
                    message.className = "form-message form-message--error";
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Authenticating...';
                message.textContent = "";
                message.className = "form-message";

                try {
                    // Authenticate with MongoDB Admin collection via REST API
                    const data = await window.CBAuth.adminLogin(contact, password);

                    message.textContent = "Authentication successful! Accessing Dashboard...";
                    message.className = "form-message form-message--success";

                    localStorage.setItem("adminUser", JSON.stringify(data));

                    setTimeout(() => {
                        window.location.href = "/admin/dashboard";
                    }, 800);

                } catch (error) {
                    message.textContent = error.message || "Invalid admin username or password.";
                    message.className = "form-message form-message--error";
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-lock me-2"></i> Sign In to Portal';
                }
            });
        });
    </script>
</body>
</html>
