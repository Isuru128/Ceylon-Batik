<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ceylon Batik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet">
</head>

<body class="auth-body">
<main class="auth-shell">

    <a class="brand-lockup auth-brand" href="/">
<span class="brand-mark">CB</span><span><strong>Ceylon Batik</strong>
<small>සිලෝන් බතික්</small></span>
    </a>

    <section class="auth-panel">

        <div class="auth-art">

            <img src="/images/03.jpeg" alt="Batik">

            <div>
                <p class="eyebrow">Welcome Back</p>

                <h1>Sign in</h1>

                <p>Access your account.</p>
            </div>
        </div>

        <form id="loginForm" class="auth-form">
            <h2>Login</h2>

            <label>Email or Phone Number<input type="text" id="contact" required autocomplete="username"></label>

            <label>Password<input type="password" id="password" required autocomplete="current-password"></label>

            <button class="btn cb-btn" type="submit" id="loginSubmit">Sign In</button>

            <p id="message" class="form-message" role="alert" aria-live="polite"></p>

            <p class="auth-switch">
                New customer?
                <a href="/register.html">
                    Create account
                </a>
            </p>
        </form>
    </section>
</main>

<script src="/js/auth.js"></script>

<script>
    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("loginSubmit");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const contact  = document.getElementById("contact").value.trim();
        const password = document.getElementById("password").value;
        const message  = document.getElementById("message");

        if (!contact || !password) {
            message.textContent = "Please enter your email/phone and password.";
            message.className = "form-message form-message--error";
            return;
        }

        // Loading state
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in…";
        message.textContent = "";
        message.className = "form-message";

        try {
            const data = await CBAuth.login(contact, password);

            message.textContent = "Login successful. Redirecting…";
            message.className = "form-message form-message--success";

            localStorage.setItem("user", JSON.stringify(data));

            setTimeout(() => {
                window.location.href = "/index.html";
            }, 1000);

        } catch (error) {
            message.textContent = error.message || "Login failed. Please try again.";
            message.className = "form-message form-message--error";
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign In";
        }
    });
</script>
</body>
</html>
