<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ceylon Batik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" href="/css/style.css" rel="stylesheet" onerror="this.onerror=null;this.href='../static/css/style.css'">
</head>
<body class="auth-body">
<main class="auth-shell">
    <a class="brand-lockup auth-brand" th:href="@{/}" href="index.html">
        <span class="brand-mark">CB</span>
        <span><strong>Ceylon Batik</strong><small>සිලෝන් බතික්</small></span>
    </a>
    <section class="auth-panel">
        <div class="auth-art">
            <img th:src="@{/images/03.jpeg}" src="/images/03.jpeg" onerror="this.onerror=null;this.src='../static/images/03.jpeg'" alt="Ceylon Batik customer style">
            <div>
                <p class="eyebrow">Welcome Back</p>
                <h1>Sign in for faster checkout</h1>
                <p>Track your wishlist, saved cart, and new traditional batik arrivals.</p>
            </div>
        </div>
        <form class="auth-form" id="loginForm" novalidate data-auth-panel="login">
            <h2>Login</h2>
            <label>Email address<input type="email" id="loginEmail" placeholder="you@example.com" required></label>
            <label>Password<input type="password" id="loginPassword" placeholder="Enter password" required></label>
            <div class="auth-options">
                <label class="check-line"><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button class="btn cb-btn" type="submit">Sign In</button>
            <p class="form-message" id="loginMessage"></p>
            <p class="auth-switch">New to Ceylon Batik? <a th:href="@{/register.html}" href="register.html">Sign up</a></p>
        </form>
    </section>
</main>
<script th:src="@{/js/script.js}" src="/js/script.js" onerror="this.onerror=null;this.src='../static/js/script.js'"></script>
</body>
</html>
